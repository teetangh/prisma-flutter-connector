name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Get dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run analyzer
        run: dart analyze --fatal-infos

      - name: Check for outdated dependencies
        run: dart pub outdated
        continue-on-error: true

      - name: Verify publishable to pub.dev
        # Allow warnings (e.g., submodule gitignore notice) but catch errors
        run: dart pub publish --dry-run || [ $? -eq 65 ]
