name: prisma_flutter_connector
description: >-
  A type-safe, pure-Dart Prisma ORM connector and code generator for Dart and
  Flutter applications with support for PostgreSQL, Supabase, and SQLite.
version: 1.0.0
homepage: https://github.com/teetangh/prisma-flutter-connector
repository: https://github.com/teetangh/prisma-flutter-connector
issue_tracker: https://github.com/teetangh/prisma-flutter-connector/issues
documentation: https://github.com/teetangh/prisma-flutter-connector#readme

topics:
  - prisma
  - orm
  - database
  - code-generation
  - postgresql

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.4.2
  code_builder: ^4.10.0
  collection: ^1.18.0
  crypto: ^3.0.3
  dart_style: ^3.0.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  meta: ^1.11.0
  postgres: ^3.5.9
  # Wide range so consumers on sentry 8.x (e.g. the mobile backend) and 9.x
  # (the Flutter app) both resolve; the connector only uses the stable
  # captureException / isEnabled surface.
  sentry: ">=8.0.0 <10.0.0"
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.6
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  lints: ^5.0.0
  test: ^1.25.0

executables:
  generate:
